name: Check US visa wait times

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-action.txt
          python -m playwright install chromium

      - name: Check official wait-time page
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VISA_CITIES: ${{ vars.VISA_CITIES }}
          VISA_TYPE: ${{ vars.VISA_TYPE }}
          TARGET_MONTHS: ${{ vars.TARGET_MONTHS }}
          SEARCH_HORIZON_MONTHS: ${{ vars.SEARCH_HORIZON_MONTHS }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python action_checker.py

      - name: Save latest public values
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add action_state.json
          git diff --cached --quiet || git commit -m "Update visa wait-time state"
          git push || true
