name: Check US visa wait times

on:
  schedule:
    # UTC time. Сейчас проверка 2 раза в час: на 17-й и 47-й минуте.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visa-wait-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-action.txt
          python -m playwright install --with-deps chromium

      - name: Check official wait-time page
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VISA_CITIES: ${{ vars.VISA_CITIES }}
          VISA_TYPE: ${{ vars.VISA_TYPE }}
          TARGET_MONTHS: ${{ vars.TARGET_MONTHS }}
          SEARCH_HORIZON_MONTHS: ${{ vars.SEARCH_HORIZON_MONTHS }}
          # При ручном запуске через Run workflow бот пришлёт статус даже без изменений.
          # При запуске по расписанию уведомления будут только при нужном изменении.
          SEND_STATUS: ${{ github.event_name == 'workflow_dispatch' }}
        run: python action_checker.py

      - name: Save latest public values
        run: |
          if git diff --quiet -- action_state.json; then
            echo "State did not change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add action_state.json
          git commit -m "Update visa wait-time state [skip ci]"
          git push
